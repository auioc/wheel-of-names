<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wheel of Names (Control)</title>
        <!-- rollup:css -->
    </head>
    <body>
        <h1>Wheel of Names</h1>
        <div id="items">
            <textarea id="item-input" placeholder="&lt;Item Label&gt;[, Weight][, Display Weight]"></textarea>
            <table id="item-table">
                <thead>
                    <tr>
                        <th>Check</th>
                        <th>Weight</th>
                        <th>Label</th>
                    </tr>
                </thead>
                <tbody id="item-list"></tbody>
            </table>
        </div>
        <div id="controls">
            <span id="status"></span>
            <br />
            <button type="button" id="update-btn">Update</button>
            <button type="button" id="spin-btn">Spin</button>
            <button type="button" id="reset-btn">Reset</button>
            <button type="button" id="clean-btn">Clean</button>
            <br />
            <button type="button" id="remove-btn">Remove last result</button>
        </div>
        <ul id="result-list"></ul>
        <div id="footer"><!-- rollup:footer --></div>
        <!-- rollup:js -->
    </body>
</html>
